services:
  # ── 1. The Post Office (Message Broker) ──
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: xray-rabbitmq
    ports:
      - "5672:5672"   # RabbitMQ Port
      - "15672:15672" # Management UI Port
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # Crucial: Gives the 5 plugins time to boot

  # ── 2. The ML Brain (ResNet18 Inference) ──
  classifier:
    build:
      context: ./services/classifier
      dockerfile: Dockerfile
    container_name: xray-classifier
    # Running ResNet18 with xray_classifier.pth
    restart: always

  # ── 3. The Clinical Logic (Triage) ──
  severity:
    build:
      context: ./services/severity
      dockerfile: Dockerfile
    container_name: xray-severity
    restart: always

  # ── 4. The Shield (Metadata & Disclaimers) ──
  info:
    build:
      context: ./services/info
      dockerfile: Dockerfile
    container_name: xray-info
    restart: always

  # ── 5. The Conductor (API Gateway) ──
  gateway:
    build:
      context: ./services/gateway
      dockerfile: Dockerfile
    container_name: xray-gateway
    ports:
      - "8000:8000"
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

  # ── 6. The Memory (Audit Logger) ──
  logger:
    build:
      context: ./services/logger
      dockerfile: Dockerfile
    container_name: xray-logger
    environment:
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: always

  # ── 7. The Client (React UI) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xray-frontend
    ports:
      - "5173:5173"
    depends_on:
      - gateway
    restart: always